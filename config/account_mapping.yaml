# Account Mapping & Roll-up Rules for Data Refinery DWH
version: "1.0"

waterfall_lines:
  GROSS_REVENUE:
    name: "총매출액"
    category: "REVENUE"
    sign_multiplier: 1
    waterfall_step: "GROSS_MARGIN"
    is_subtotal: false

  SALES_DEDUCTION:
    name: "매출차감및할인"
    category: "DEDUCTION"
    sign_multiplier: -1
    waterfall_step: "GROSS_MARGIN"
    is_subtotal: false

  COGS:
    name: "제조및매입원가"
    category: "COGS"
    sign_multiplier: -1
    waterfall_step: "GROSS_MARGIN"
    is_subtotal: false

  LOGISTICS_COST:
    name: "물류보관운송비"
    category: "LOGISTICS"
    sign_multiplier: -1
    waterfall_step: "CONTRIBUTION_MARGIN"
    is_subtotal: false

  PROMOTION_COST:
    name: "유통판촉마케팅비"
    category: "PROMOTION"
    sign_multiplier: -1
    waterfall_step: "CONTRIBUTION_MARGIN"
    is_subtotal: false

  WARRANTY_COST:
    name: "품질보증및서비스비"
    category: "WARRANTY"
    sign_multiplier: -1
    waterfall_step: "CONTRIBUTION_MARGIN"
    is_subtotal: false

  FIXED_SGNA:
    name: "고정판매관리비"
    category: "FIXED_COST"
    sign_multiplier: -1
    waterfall_step: "OPERATING_PROFIT"
    is_subtotal: false

  SUBTOTAL_IGNORED:
    name: "원천계산소계(이중집계방지)"
    category: "SUBTOTAL"
    sign_multiplier: 1
    waterfall_step: "NON_ADDITIVE"
    is_subtotal: true


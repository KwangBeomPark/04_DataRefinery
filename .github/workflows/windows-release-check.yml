name: Windows release check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.16.1
      - name: Check Python code
        run: ruff check --select E4,E7,E9,F src tests
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build unsigned test installer
        shell: pwsh
        run: .\scripts\build_release.ps1 -SkipTests -SkipSign
      - name: Build unsigned test launcher
        shell: pwsh
        run: .\scripts\build_launcher.ps1 -SkipTests -SkipSign
      - name: Check install and uninstall
        shell: pwsh
        run: .\scripts\smoke_installer.ps1

name: Windows release check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run shared quality checks
        shell: powershell
        run: .\scripts\check.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build unsigned test installer
        shell: pwsh
        run: .\scripts\build.ps1 -SkipTests
      - name: Check install and uninstall
        shell: pwsh
        run: .\scripts\smoke_installer.ps1
